name: Validar a taxonomia e a aplicação
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar o leitor de PDF
        run: python -m pip install -r requirements_build.txt
      - name: Preparar as dependências de desenvolvimento
        run: npm ci
      - name: Conferir o JavaScript
        run: npm run check
      - name: Executar os testes de conciliação
        run: npm test
      - name: Validar dados e fontes incorporadas
        run: npm run validate
      - name: Conferir os cinco sistemas e os quatro idiomas
        run: npm run validate:systems
      - name: Conferir o consenso e os textos brasileiros nos PDFs
        run: npm run validate:consensus
      - name: Construir o HTML portátil
        run: npm run build
      - name: Preparar o navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Verificar câmera, séries, idiomas e exportações no navegador
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saber-brasil-portatil
          path: |
            Saber_Brasil_Offline.html
            test-results/
            playwright-report/
            evidence/Testes_Navegador_Consenso_V3.json
            evidence/Validacao_Dados.json
            evidence/Validacao_Multissistema.json
            evidence/Consenso_Camadas_V3.json
            evidence/Consenso_V3_*.png
